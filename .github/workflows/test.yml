name: Test

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: echo "Checking out code..."

      - uses: actions/checkout@v4

      - name: Setup Node.js
        run: echo "Setting up Node.js 22 with npm cache..."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          echo "Installing dependencies with npm ci..."
          npm ci

      - name: Run tests
        run: |
          echo "Running test suite with npm test..."
          npm test
