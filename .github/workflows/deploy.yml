name: Remote SSH Command
on: 
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USERNAME }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              echo "Installing Node.js and npm..."
              if [ ! -s "$NVM_DIR/nvm.sh" ]; then
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.2/install.sh | bash
                . "$NVM_DIR/nvm.sh"
              fi
              nvm install 22
            else
              echo "Node.js $(node -v) and npm $(npm -v) already installed"
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "Installing PM2 for current user..."
              npm install -g pm2
            else
              echo "PM2 $(pm2 -v) already installed"
            fi

            if [ -d "backend-demo/.git" ]; then
              echo "Repository exists, pulling latest changes..."
              cd backend-demo
              git pull origin main
            else
              echo "Cloning repository..."
              git clone ${{ secrets.REPO_URL }}
              cd backend-demo
            fi
            echo "Setting up production environment file..."
            echo "NODE_ENV=production" > .env
            echo "PORT=${{ secrets.PROD_PORT }}" >> .env

            npm install
            npm run build
            pm2 stop ecosystem.config.cjs
            pm2 reload ecosystem.config.cjs --env production